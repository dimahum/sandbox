syntax = "proto3";

package starlink;

option go_package = "starlink-cntrl-grpc/pkg/starlink";

// Starlink Control Service
service StarlinkControl {
  // Get satellite status
  rpc GetSatelliteStatus(SatelliteRequest) returns (SatelliteResponse);
  
  // Update satellite configuration
  rpc UpdateSatelliteConfig(ConfigUpdateRequest) returns (ConfigUpdateResponse);
  
  // Stream telemetry data
  rpc StreamTelemetry(TelemetryRequest) returns (stream TelemetryData);
}

// Request message for satellite status
message SatelliteRequest {
  string satellite_id = 1;
}

// Response message for satellite status
message SatelliteResponse {
  string satellite_id = 1;
  string status = 2;
  double latitude = 3;
  double longitude = 4;
  double altitude = 5;
  int64 timestamp = 6;
}

// Request message for configuration update
message ConfigUpdateRequest {
  string satellite_id = 1;
  map<string, string> config = 2;
}

// Response message for configuration update
message ConfigUpdateResponse {
  bool success = 1;
  string message = 2;
}

// Request message for telemetry stream
message TelemetryRequest {
  string satellite_id = 1;
  int32 interval_seconds = 2;
}

// Telemetry data message
message TelemetryData {
  string satellite_id = 1;
  double temperature = 2;
  double power_level = 3;
  string signal_strength = 4;
  int64 timestamp = 5;
}